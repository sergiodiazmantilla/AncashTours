<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explora Tours | ÁncashCosta Pass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Barra Superior Unificada -->
  <header class="navbar navbar-expand-lg bg-white border-bottom sticky-top px-4 py-2">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-water fs-3"></i>
        <div>
          ÁncashCosta Pass
          <small class="d-block text-muted" style="font-size: 0.7rem; letter-spacing: 1px;">CASMA — CHIMBOTE, PERÚ</small>
        </div>
      </a>

      <!-- 3 opciones para el Turista -->
      <nav aria-label="Navegación del turista" class="d-flex gap-4 my-2 my-lg-0">
        <a href="index.html" class="nav-link fw-semibold">Explorar</a>
        <a href="tours.html" class="nav-link fw-semibold">Tours</a>
        <a href="ticket.html" id="navMiTicket" class="nav-link fw-semibold">Mi ticket</a>
      </nav>

      <div class="d-flex align-items-center gap-3">
        <!-- Controles de Accesibilidad -->
        <div class="d-flex align-items-center gap-2" role="region" aria-label="Herramientas de accesibilidad">
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" id="contrastToggle">
            <label class="form-check-label small" for="contrastToggle">Alto contraste</label>
          </div>
          <button id="fontDecrease" class="btn btn-outline-secondary btn-sm">A-</button>
          <button id="fontIncrease" class="btn btn-outline-secondary btn-sm">A+</button>
        </div>
        
      </div>
    </div>
  </header>

  <main class="container-fluid px-4 py-4">
    <div class="mb-4">
      <span class="text-uppercase small fw-bold text-brand">Explora el corredor</span>
      <h1 class="h2 fw-bold mt-1">Elige tu próxima historia</h1>
      <p class="text-muted">Patrimonio, paisajes y mar. Descubre experiencias verificadas que nacen en nuestra costa.</p>
    </div>

    <!-- Barra de búsqueda y filtros por destino -->
    <div class="bg-white p-3 rounded-4 border shadow-sm mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-5">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Busca una experiencia (ej. Chankillo, lancha...)" aria-label="Buscar experiencia">
          </div>
        </div>
        <div class="col-md-7 d-flex flex-wrap gap-2">
          <button class="btn btn-brand btn-sm px-3 filter-btn active" data-filter="todos">Todos los destinos</button>
          <button class="btn btn-outline-secondary btn-sm px-3 filter-btn" data-filter="casma">Casma</button>
          <button class="btn btn-outline-secondary btn-sm px-3 filter-btn" data-filter="chimbote">Chimbote</button>
        </div>
      </div>
    </div>

    <!-- Grilla de Tours -->
    <div class="row g-4" id="gridCatalogoTours">
      <!-- Contenido a cargar -->
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/accessibility.js"></script>
  <script>
    // Filtro interactivo por destino y texto (HU #1)
    const filterBtns = document.querySelectorAll('.filter-btn');
    const tourItems = document.querySelectorAll('.tour-item');
    const searchInput = document.getElementById('searchInput');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => {
          b.classList.remove('btn-brand', 'active');
          b.classList.add('btn-outline-secondary');
        });
        btn.classList.remove('btn-outline-secondary');
        btn.classList.add('btn-brand', 'active');

        const destino = btn.dataset.filter;
        tourItems.forEach(item => {
          item.style.display = (destino === 'todos' || item.dataset.destino === destino) ? 'block' : 'none';
        });
      });
    });

    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      tourItems.forEach(item => {
        item.style.display = item.textContent.toLowerCase().includes(q) ? 'block' : 'none';
      });
    });
  </script>

  <script>
    async function cargarCatalogoTours(filtroDestino = 'Todos') {
      await inicializarBaseDatos();
      let tours = obtenerTodosLosTours().filter(t => t.seccion === 'tours');
      if (filtroDestino !== 'Todos') {
        tours = tours.filter(t => t.destino === filtroDestino);
      }

      const contenedor = document.getElementById('gridCatalogoTours');
      contenedor.innerHTML = tours.map(t => `
        <div class="col-md-4">
          <div class="card border-0 shadow-sm rounded-4 h-100 overflow-hidden">
            <div class="position-relative">
              <img src="${t.imagen}" class="card-img-top" alt="${t.titulo}" style="height: 200px; object-fit: cover;">
              <span class="badge bg-white text-dark position-absolute top-0 start-0 m-3 shadow-sm">${t.categoria}</span>
            </div>
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <div class="d-flex justify-content-between small text-muted mb-1">
                  <span>${t.destino}, Áncash</span>
                  <span>${t.duracion} • propuesta</span>
                </div>
                <h3 class="h5 fw-bold mb-2">${t.titulo}</h3>
                <p class="small text-muted">${t.descripcion}</p>
              </div>
              <div class="d-flex justify-content-between align-items-center pt-3 border-top mt-3">
                <div>
                  <strong class="fs-5 text-dark">S/ ${t.precio}.00</strong>
                  <small class="d-block text-muted" style="font-size: 0.72rem;">Tarifa referencial</small>
                </div>
                <a href="detalle-tour.html?id=${t.id}" class="btn btn-brand btn-sm px-3 py-2 fw-semibold">
                  → Ver tour
                </a>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', () => cargarCatalogoTours('Todos'));
  </script>
</body>
</html>
