<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasajeros | Zona de Operadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/db.js"></script>
  <script>protegerRutaOperador();</script>

  <header class="navbar bg-white border-bottom sticky-top px-4 py-2">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2">
        <i class="bi bi-water fs-3"></i>
        <div>
          ÁncashCosta Pass
          <small class="d-block text-muted" style="font-size: 0.7rem; letter-spacing: 1px;">ZONA DE OPERADORES</small>
        </div>
      </span>
      <div class="d-flex align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="contrastToggle">
          <label class="form-check-label small" for="contrastToggle">Alto contraste</label>
        </div>
        <button id="fontDecrease" class="btn btn-outline-secondary btn-sm">A-</button>
        <button id="fontIncrease" class="btn btn-outline-secondary btn-sm">A+</button>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="d-flex gap-2">
      <button onclick="descargarBaseDatosJSON()" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-download me-1"></i> Descargar JSON actualizado
      </button>
      <button onclick="if(confirm('¿Restaurar datos originales?')) restaurarDatosFabrica();" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar datos
      </button>
    </div>
    <div class="row min-vh-100">
      <aside class="col-md-3 col-lg-2 bg-white border-end p-3 d-flex flex-column justify-content-between">
        <div>
          <span class="small text-uppercase text-muted fw-bold px-2">Espacio Local</span>
          <h2 class="h6 fw-bold px-2 mb-3">Mi operación</h2>
          <nav class="nav flex-column gap-1">
            <a href="dashboard-operador.html" class="nav-link text-dark rounded-3">
              <i class="bi bi-grid me-2"></i> Panel general
            </a>
            <a href="pasajeros-operador.html" class="nav-link active bg-primary-subtle text-primary fw-semibold rounded-3">
              <i class="bi bi-people me-2"></i> Pasajeros
            </a>
          </nav>
        </div>
        <div class="pt-3 border-top">
          <button onclick="cerrarSesionOperador()" class="btn btn-outline-danger btn-sm w-100 fw-semibold">
            <i class="bi bi-box-arrow-left me-1"></i> Cerrar sesión
          </button>
        </div>
      </aside>

      <main class="col-md-9 col-lg-10 p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div>
            <span class="text-uppercase small fw-bold text-brand">Operación Local / Pasajeros</span>
            <h1 class="h3 fw-bold mb-1">Cada visita empieza con un nombre</h1>
            <p class="text-muted small mb-0">Revisa las reservas recientes y gestiona los cupos disponibles.</p>
          </div>
          <!-- Botón para limpiar pruebas y volver al JSON original -->
          <button onclick="if(confirm('¿Restaurar los datos originales del JSON?')) restaurarDatosFabrica();" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar datos de ejemplo
          </button>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Titular</th>
                  <th>Experiencia</th>
                  <th>Fecha de visita</th>
                  <th>Pasajeros</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaPasajerosBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/accessibility.js"></script>
  <script>
    function renderizarTablaPasajeros() {
        const tbody = document.getElementById('tablaPasajerosBody');
        const reservas = obtenerReservasDelOperadorActivo();
        tbody.innerHTML = '';

        if (reservas.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-4">No hay reservas registradas actualmente.</td></tr>';
          return;
        }

        reservas.forEach((r, index) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="fw-semibold">${r.titular}</td>
            <td>${r.experiencia}</td>
            <td>${r.fecha}</td>
            <td>${r.pasajeros}</td>
            <td><span class="badge bg-success-subtle text-success">${r.estado}</span></td>
            <td class="text-end">
              <button class="btn btn-sm btn-outline-danger" onclick="eliminarRegistro(${index})">
                <i class="bi bi-trash"></i> Eliminar
              </button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }

      function eliminarRegistro(index) {
        if (confirm('¿Deseas eliminar esta reserva y liberar el cupo del tour?')) {
          eliminarReservaPorIndice(index);
          renderizarTablaPasajeros();
        }
      }

      document.addEventListener('DOMContentLoaded', renderizarTablaPasajeros);
  </script>
</body>
</html>
