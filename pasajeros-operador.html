<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pasajeros | Zona de Operadores</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/accessibility.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <script src="js/db.js"></script>
  <script>protegerRutaOperador();</script>

  <!-- Cabecera Exclusiva del Operador -->
  <header class="navbar bg-white border-bottom sticky-top px-4 py-2">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold text-primary d-flex align-items-center gap-2" href="dashboard-operador.html">
        <i class="bi bi-water fs-3"></i>
        <div>
          ÁncashCosta Pass
          <small class="d-block text-muted" style="font-size: 0.7rem; letter-spacing: 1px;">ZONA DE OPERADORES</small>
        </div>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-3">
        <div class="form-check form-switch mb-0">
          <input class="form-check-input" type="checkbox" id="contrastToggle">
          <label class="form-check-label small" for="contrastToggle">Alto contraste</label>
        </div>
        <button id="fontDecrease" class="btn btn-outline-secondary btn-sm">A-</button>
        <button id="fontIncrease" class="btn btn-outline-secondary btn-sm">A+</button>
        <span class="badge bg-light text-dark border px-3 py-2" id="badgeOperadorNombre">
          <i class="bi bi-person-circle me-1"></i> Operador
        </span>
      </div>
    </div>
  </header>

  <div class="container-fluid">
    <div class="row min-vh-100">
      <!-- Barra Lateral -->
      <aside class="col-md-3 col-lg-2 bg-white border-end p-3 d-flex flex-column justify-content-between">
        <div>
          <span class="small text-uppercase text-muted fw-bold px-2">Espacio Local</span>
          <h2 class="h6 fw-bold px-2 mb-3">Mi operación</h2>
          <nav class="nav flex-column gap-1">
            <a href="dashboard-operador.html" class="nav-link text-dark rounded-3">
              <i class="bi bi-grid me-2"></i> Panel general
            </a>
            <a href="pasajeros-operador.html" class="nav-link active bg-primary-subtle text-primary fw-semibold rounded-3">
              <i class="bi bi-people me-2"></i> Pasajeros
            </a>
          </nav>
        </div>
        <div class="pt-3 border-top">
          <button onclick="cerrarSesionOperador()" class="btn btn-outline-danger btn-sm w-100 fw-semibold">
            <i class="bi bi-box-arrow-left me-1"></i> Cerrar sesión
          </button>
        </div>
      </aside>

      <!-- Contenido Principal -->
      <main class="col-md-9 col-lg-10 p-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
          <div>
            <span class="text-uppercase small fw-bold text-brand">Operación Local / Pasajeros</span>
            <h1 class="h3 fw-bold mb-1">Cada visita empieza con un nombre</h1>
            <p class="text-muted small mb-0" id="subtituloOperadorTours">Mostrando reservas asignadas a tus rutas.</p>
          </div>
          <div class="d-flex gap-2">
            <button onclick="descargarBaseDatosJSON()" class="btn btn-outline-primary btn-sm">
              <i class="bi bi-download me-1"></i> Descargar datos
            </button>
            <button onclick="if(confirm('¿Restaurar datos originales del JSON?')) restaurarDatosFabrica();" class="btn btn-outline-secondary btn-sm">
              <i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar datos
            </button>
          </div>
        </div>

        <!-- Barra de Búsqueda y Filtros (Nombre, Tour y Fecha) -->
        <div class="card border-0 shadow-sm rounded-4 p-3 mb-3 bg-white">
          <div class="row g-2 align-items-end">
            <div class="col-md-4">
              <label for="filtroNombrePasajero" class="form-label small fw-semibold mb-1">Buscar pasajero o código</label>
              <div class="input-group input-group-sm">
                <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
                <input type="text" id="filtroNombrePasajero" class="form-control" placeholder="Ej. Nicolás Poma o ACP-101...">
              </div>
            </div>

            <div class="col-md-4">
              <label for="filtroTourPasajero" class="form-label small fw-semibold mb-1">Filtrar por experiencia</label>
              <select id="filtroTourPasajero" class="form-select form-select-sm">
                <option value="TODOS">Todas mis experiencias</option>
              </select>
            </div>

            <div class="col-md-3">
              <label for="filtroFechaPasajero" class="form-label small fw-semibold mb-1">Fecha de visita</label>
              <input type="date" id="filtroFechaPasajero" class="form-control form-control-sm">
            </div>

            <div class="col-md-1 d-grid">
              <button type="button" id="btnLimpiarFiltros" class="btn btn-outline-secondary btn-sm" title="Limpiar filtros">
                <i class="bi ">Limpiar</i>
              </button>
            </div>
          </div>
        </div>

        <!-- Tabla de Pasajeros -->
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="small text-muted" id="contadorResultadosPasajeros">Mostrando 0 reservas</span>
          </div>

          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Titular</th>
                  <th>Experiencia</th>
                  <th>Fecha de visita</th>
                  <th>Pasajeros</th>
                  <th>Estado</th>
                  <th class="text-end">Acciones</th>
                </tr>
              </thead>
              <tbody id="tablaPasajerosBody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/accessibility.js"></script>
  <script>
    let todasMisReservas = [];

    // Normaliza fechas tipo "15/09/2026" y "2026-09-15" para comparar correctamente con el input date
    function normalizarFechaISO(fechaStr) {
      if (!fechaStr) return '';
      if (fechaStr.includes('/')) {
        const partes = fechaStr.split('/');
        if (partes.length === 3) return `${partes[2]}-${partes[1].padStart(2, '0')}-${partes[0].padStart(2, '0')}`;
      }
      return fechaStr;
    }

    function aplicarFiltrosPasajeros() {
      const texto = document.getElementById('filtroNombrePasajero').value.toLowerCase().trim();
      const tourIdFiltro = document.getElementById('filtroTourPasajero').value;
      const fechaFiltro = document.getElementById('filtroFechaPasajero').value;

      const filtradas = todasMisReservas.filter(r => {
        const coincideTexto = !texto ||
          (r.titular && r.titular.toLowerCase().includes(texto)) ||
          (r.id && r.id.toLowerCase().includes(texto));

        const coincideTour = (tourIdFiltro === 'TODOS') || (r.tourId === tourIdFiltro);

        const fechaReservaISO = normalizarFechaISO(r.fecha);
        const coincideFecha = !fechaFiltro || (fechaReservaISO === fechaFiltro);

        return coincideTexto && coincideTour && coincideFecha;
      });

      renderizarTablaPasajeros(filtradas);
    }

    function renderizarTablaPasajeros(lista) {
      const tbody = document.getElementById('tablaPasajerosBody');
      const contador = document.getElementById('contadorResultadosPasajeros');
      tbody.innerHTML = '';

      const totalPax = lista.reduce((acc, r) => acc + (parseInt(r.pasajeros) || 0), 0);
      contador.textContent = `Mostrando ${lista.length} ${lista.length === 1 ? 'reserva' : 'reservas'} (${totalPax} pasajeros en total)`;

      if (lista.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No se encontraron pasajeros con los filtros seleccionados.</td></tr>';
        return;
      }

      lista.forEach((r) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="badge bg-light text-dark border">${r.id}</span></td>
          <td class="fw-semibold">${r.titular}</td>
          <td>${r.experiencia}</td>
          <td>${r.fecha}</td>
          <td>${r.pasajeros}</td>
          <td><span class="badge bg-success-subtle text-success">${r.estado}</span></td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" onclick="borrarReserva('${r.id}')">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function cargarPasajerosOperador() {
      await inicializarBaseDatos();
      const op = obtenerOperadorActivo();
      const misTours = obtenerToursDelOperadorActivo();

      if (op) {
        document.getElementById('badgeOperadorNombre').innerHTML = `<i class="bi bi-person-circle me-1"></i> ${op.nombre}`;
        document.getElementById('subtituloOperadorTours').textContent = `Rutas a tu cargo: ${misTours.map(t => t.titulo).join(' • ')}`;
      }

      // Llenar el selector desplegable con sus 3 tours
      const selectTour = document.getElementById('filtroTourPasajero');
      selectTour.innerHTML = '<option value="TODOS">Todas mis experiencias</option>';
      misTours.forEach(t => {
        const opt = document.createElement('option');
        opt.value = t.id;
        opt.textContent = `${t.titulo} (${t.destino})`;
        selectTour.appendChild(opt);
      });

      todasMisReservas = obtenerReservasDelOperadorActivo();
      aplicarFiltrosPasajeros();
    }

    function borrarReserva(idReserva) {
      if (confirm('¿Deseas anular esta reserva y liberar el cupo en tu ruta?')) {
        eliminarReservaPorId(idReserva);
        todasMisReservas = obtenerReservasDelOperadorActivo();
        aplicarFiltrosPasajeros();
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      cargarPasajerosOperador();

      document.getElementById('filtroNombrePasajero').addEventListener('input', aplicarFiltrosPasajeros);
      document.getElementById('filtroTourPasajero').addEventListener('change', aplicarFiltrosPasajeros);
      document.getElementById('filtroFechaPasajero').addEventListener('change', aplicarFiltrosPasajeros);
      document.getElementById('btnLimpiarFiltros').addEventListener('click', () => {
        document.getElementById('filtroNombrePasajero').value = '';
        document.getElementById('filtroTourPasajero').value = 'TODOS';
        document.getElementById('filtroFechaPasajero').value = '';
        aplicarFiltrosPasajeros();
      });
    });
  </script>
</body>
</html>
